services:

  mysql:
    image: mysql:8
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: furniture
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: ecommerce-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: furniture

  client:
    build: ./client
    container_name: ecommerce-client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

  admin:
    build: ./admin2
    container_name: ecommerce-admin
    restart: always
    depends_on:
      - server
    ports:
      - "3001:80"

volumes:
  mysql_data: